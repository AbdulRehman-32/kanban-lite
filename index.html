<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Task Board - Kanban Lite</title>
  <meta name="description" content="A responsive, feature-rich interactive Kanban task board built with vanilla HTML5, CSS3, and JavaScript." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-container">
    <!-- Header Area -->
    <header class="app-header">
      <div class="header-main">
        <div class="brand">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
          </div>
          <div>
            <h1>Task Flow Board</h1>
            <p class="subtitle">Organise, track, and manage your daily project tasks</p>
          </div>
        </div>
        
        <div class="header-actions">
          <!-- Summary Task Counters (Stretch Goal) -->
          <div class="stats-badge" title="Active vs Completed Tasks">
            <span class="stat-item"><strong id="stat-active">0</strong> Active</span>
            <span class="stat-divider">/</span>
            <span class="stat-item text-success"><strong id="stat-completed">0</strong> Done</span>
          </div>

          <!-- Theme Toggle Button (Stretch Goal) -->
          <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Dark Mode" title="Toggle Light / Dark Mode">
            <span class="theme-icon light-icon" aria-hidden="true">☀️</span>
            <span class="theme-icon dark-icon" aria-hidden="true">🌙</span>
            <span class="theme-text">Theme</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Controls & Creation Section -->
    <section class="controls-section" aria-label="Task Management Controls">
      <!-- Add New Task Form -->
      <div class="form-card">
        <h2 class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          Create New Task
        </h2>
        <form id="task-form" class="task-form">
          <div class="form-row">
            <div class="form-group flex-2">
              <label for="task-title">Task Title <span class="required">*</span></label>
              <input 
                type="text" 
                id="task-title" 
                placeholder="e.g. Design homepage hero section..." 
                required 
                maxlength="100"
              />
            </div>
            
            <div class="form-group flex-1">
              <label for="task-category">Category <span class="required">*</span></label>
              <select id="task-category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Development">Development</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
                <option value="Research">Research</option>
                <option value="General">General</option>
              </select>
            </div>

            <div class="form-group flex-1">
              <label for="task-priority">Priority <span class="required">*</span></label>
              <select id="task-priority" required>
                <option value="" disabled selected>Select Priority</option>
                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-full">
              <label for="task-description">Description <span class="optional">(Optional)</span></label>
              <input 
                type="text" 
                id="task-description" 
                placeholder="Brief description or context for this task..." 
                maxlength="250"
              />
            </div>
            <div class="form-group form-actions">
              <button type="submit" class="btn btn-primary" id="btn-add-task">
                <span>Add Task</span>
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Filter & Search Toolbar -->
      <div class="filter-card">
        <div class="filter-bar">
          <div class="search-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              id="search-input" 
              placeholder="Search tasks by title or description..." 
              aria-label="Search tasks"
            />
            <button type="button" id="clear-search-btn" class="clear-btn" aria-label="Clear search" title="Clear search">✕</button>
          </div>

          <div class="filter-controls">
            <div class="select-wrapper">
              <label for="category-filter" class="sr-only">Filter by Category</label>
              <select id="category-filter" aria-label="Filter by Category">
                <option value="All">All Categories</option>
                <option value="Development">Development</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
                <option value="Research">Research</option>
                <option value="General">General</option>
              </select>
            </div>

            <div class="select-wrapper">
              <label for="priority-filter" class="sr-only">Filter by Priority</label>
              <select id="priority-filter" aria-label="Filter by Priority">
                <option value="All">All Priorities</option>
                <option value="High">High Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="Low">Low Priority</option>
              </select>
            </div>

            <button type="button" id="reset-filters-btn" class="btn btn-secondary btn-sm" title="Reset all filters">
              Reset Filters
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Kanban Columns Board -->
    <main class="board-container" id="kanban-board" aria-label="Kanban Task Board">
      <!-- To Do Column -->
      <section class="column" data-status="todo" id="col-todo" aria-labelledby="heading-todo">
        <div class="column-header">
          <div class="column-title-group">
            <span class="status-indicator indicator-todo"></span>
            <h2 id="heading-todo">To Do</h2>
          </div>
          <span class="task-count" id="count-todo">0</span>
        </div>
        <div class="task-list" id="list-todo" data-status="todo" aria-live="polite">
          <!-- Task cards injected here -->
        </div>
        <div class="empty-column-msg" id="empty-todo">No tasks to do</div>
      </section>

      <!-- In Progress Column -->
      <section class="column" data-status="in-progress" id="col-in-progress" aria-labelledby="heading-in-progress">
        <div class="column-header">
          <div class="column-title-group">
            <span class="status-indicator indicator-progress"></span>
            <h2 id="heading-in-progress">In Progress</h2>
          </div>
          <span class="task-count" id="count-in-progress">0</span>
        </div>
        <div class="task-list" id="list-in-progress" data-status="in-progress" aria-live="polite">
          <!-- Task cards injected here -->
        </div>
        <div class="empty-column-msg" id="empty-in-progress">No tasks in progress</div>
      </section>

      <!-- Completed Column -->
      <section class="column" data-status="completed" id="col-completed" aria-labelledby="heading-completed">
        <div class="column-header">
          <div class="column-title-group">
            <span class="status-indicator indicator-completed"></span>
            <h2 id="heading-completed">Completed</h2>
          </div>
          <span class="task-count" id="count-completed">0</span>
        </div>
        <div class="task-list" id="list-completed" data-status="completed" aria-live="polite">
          <!-- Task cards injected here -->
        </div>
        <div class="empty-column-msg" id="empty-completed">No completed tasks</div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Tip: You can drag and drop cards between columns or use the quick status dropdown on each card.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
