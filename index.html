<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Task Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1>Task Board</h1>
        <p class="subtitle">Organize and manage tasks across workflow stages</p>
      </div>
      
      <div class="header-right">
        <div class="task-stats" id="task-stats">
          <span>Active: <strong id="stat-active">0</strong></span>
          <span class="stat-sep">|</span>
          <span>Completed: <strong id="stat-completed">0</strong></span>
        </div>
        <button id="theme-toggle-btn" class="btn btn-outline btn-sm" type="button">
          Toggle Theme
        </button>
      </div>
    </header>

    <!-- Controls Section -->
    <section class="controls-section">
      <!-- Add Task Form -->
      <div class="card form-card">
        <h2>Add New Task</h2>
        <form id="task-form" class="task-form">
          <div class="form-grid">
            <div class="form-field flex-2">
              <label for="task-title">Title *</label>
              <input type="text" id="task-title" placeholder="Task title..." required />
            </div>

            <div class="form-field flex-1">
              <label for="task-category">Category *</label>
              <select id="task-category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Development">Development</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
                <option value="Research">Research</option>
                <option value="General">General</option>
              </select>
            </div>

            <div class="form-field flex-1">
              <label for="task-priority">Priority *</label>
              <select id="task-priority" required>
                <option value="" disabled selected>Select Priority</option>
                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
              </select>
            </div>
          </div>

          <div class="form-grid form-grid-bottom">
            <div class="form-field flex-full">
              <label for="task-description">Description (Optional)</label>
              <input type="text" id="task-description" placeholder="Short description..." />
            </div>
            <div class="form-action">
              <button type="submit" class="btn btn-primary" id="btn-add-task">Add Task</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Filters & Search Toolbar -->
      <div class="card filter-card">
        <div class="filter-row">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="Search tasks by title or description..." />
            <button type="button" id="clear-search-btn" class="clear-btn" title="Clear">✕</button>
          </div>

          <div class="filter-group">
            <select id="category-filter" aria-label="Filter by Category">
              <option value="All">All Categories</option>
              <option value="Development">Development</option>
              <option value="Design">Design</option>
              <option value="Marketing">Marketing</option>
              <option value="Research">Research</option>
              <option value="General">General</option>
            </select>

            <select id="priority-filter" aria-label="Filter by Priority">
              <option value="All">All Priorities</option>
              <option value="High">High Priority</option>
              <option value="Medium">Medium Priority</option>
              <option value="Low">Low Priority</option>
            </select>

            <button type="button" id="reset-filters-btn" class="btn btn-outline btn-sm">Reset</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Kanban Board -->
    <main class="board-container" id="kanban-board">
      <!-- To Do -->
      <section class="column" data-status="todo" id="col-todo">
        <div class="column-header">
          <h2>To Do</h2>
          <span class="count-badge" id="count-todo">0</span>
        </div>
        <div class="task-list" id="list-todo" data-status="todo"></div>
        <div class="empty-msg" id="empty-todo">No tasks</div>
      </section>

      <!-- In Progress -->
      <section class="column" data-status="in-progress" id="col-in-progress">
        <div class="column-header">
          <h2>In Progress</h2>
          <span class="count-badge" id="count-in-progress">0</span>
        </div>
        <div class="task-list" id="list-in-progress" data-status="in-progress"></div>
        <div class="empty-msg" id="empty-in-progress">No tasks</div>
      </section>

      <!-- Completed -->
      <section class="column" data-status="completed" id="col-completed">
        <div class="column-header">
          <h2>Completed</h2>
          <span class="count-badge" id="count-completed">0</span>
        </div>
        <div class="task-list" id="list-completed" data-status="completed"></div>
        <div class="empty-msg" id="empty-completed">No tasks</div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
